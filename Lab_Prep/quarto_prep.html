<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quarto Prep — SOCI 418</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F5F0; --ink:#16181D; --slate:#4A5259; --rule:#D8D3C8;
  --mark:#C4553D; --mark-soft:#F0DDD7; --ok:#5C8A5E;
  --ed-bg:#FFFFFF; --ed-gutter:#F4F2ED; --ed-num:#B0AAA0;
  --yaml-key:#7A3E9D; --yaml-val:#2E7D5B; --yaml-dash:#9A948A;
  --md-head:#1A4E8A; --fence:#6B6459; --rcode:#16181D;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px 96px}

header{border-bottom:2px solid var(--ink);padding:40px 0 22px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-bottom:14px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:clamp(34px,5.5vw,56px);line-height:1.03;letter-spacing:-.02em}
.standfirst{margin-top:14px;font-size:17px;color:var(--slate);max-width:64ch}

.rsfig{margin:26px 0 0;max-width:100%}
.rsimg{position:relative;line-height:0;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:#fff}
.rsimg img{width:100%;height:auto;display:block}
.rsimg .annot{position:absolute;inset:0;width:100%;height:100%}
.annot .arw{fill:none;stroke:#C4553D;stroke-width:3;stroke-linecap:round}
.annot .chip{fill:#fff;stroke:#C4553D;stroke-width:1.5}
.annot .bdg{fill:#C4553D;stroke:none}
.annot .bnum{font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:700;fill:#fff;text-anchor:middle}
.annot .lbl{font-family:'IBM Plex Sans',sans-serif;font-size:19px;font-weight:600;fill:#16181D}
.rsfig figcaption{margin-top:12px;font-size:14.5px;color:var(--slate);line-height:1.55;max-width:66ch}

.progress{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);padding:12px 0;margin-bottom:40px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pips{display:flex;gap:5px;flex:1;min-width:170px}
.pip{height:4px;flex:1;background:var(--rule);border-radius:2px;transition:background .3s}
.pip.done{background:var(--ok)}
.pip.here{background:var(--mark)}
.counter{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--slate);white-space:nowrap}

.part{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mark);padding:34px 0 0;border-top:2px solid var(--ink);margin-top:14px}
.part span{display:block;font-family:'Fraunces',Georgia,serif;font-size:26px;letter-spacing:-.01em;text-transform:none;color:var(--ink);margin-top:6px;font-weight:500}
.part p{font-family:'IBM Plex Sans',sans-serif;font-size:15.5px;letter-spacing:0;text-transform:none;color:var(--slate);margin-top:8px;max-width:64ch;line-height:1.55}

.step{padding:30px 0 36px;border-bottom:1px solid var(--rule);opacity:.28;transition:opacity .45s}
.step.active,.step.seen{opacity:1}
.step-head{display:flex;gap:18px;align-items:baseline;margin-bottom:8px}
.num{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--mark);letter-spacing:.08em;padding-top:6px}
h2{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(21px,2.8vw,28px);letter-spacing:-.01em;line-height:1.2}
.blurb{margin:0 0 18px 46px;max-width:64ch;color:var(--slate);font-size:16px}
.blurb code{font-family:'IBM Plex Mono',monospace;font-size:.9em;background:#EDE9E1;padding:1px 5px;border-radius:3px}
@media(max-width:640px){.blurb{margin-left:0}}

/* ---------- editor pane ---------- */
.edwrap{margin-left:46px;max-width:640px}
@media(max-width:640px){.edwrap{margin-left:0}}
.edbar{
  background:#F2F0EB;border:1px solid var(--rule);border-bottom:none;
  border-radius:8px 8px 0 0;padding:6px 12px;
  font-family:'IBM Plex Sans',sans-serif;font-size:12px;color:var(--slate);
  display:flex;align-items:center;gap:10px;
}
.edbar .fname{font-weight:600;color:var(--ink)}
.edbar .rbtn{
  margin-left:auto;background:#fff;border:1px solid var(--rule);
  border-radius:4px;padding:2px 10px;font-size:11.5px;color:var(--slate);
}
.edbar .rbtn.hot{background:var(--mark);border-color:var(--mark);color:#fff}
.editor{
  background:var(--ed-bg);border:1px solid var(--rule);border-radius:0 0 8px 8px;
  font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.85;
  overflow-x:auto;min-height:56px;padding:8px 0;
}
@media(max-width:640px){.editor{font-size:11.5px}}
.eline{display:flex;opacity:0;white-space:pre}
.eline.shown{opacity:1;animation:fade .26s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.eline .gut{
  flex:0 0 38px;text-align:right;padding-right:12px;
  color:var(--ed-num);background:var(--ed-gutter);user-select:none;
}
.eline .txt{padding-left:12px;flex:1}
.eline.yamldash .txt{color:var(--yaml-dash)}
.eline.yaml .txt{color:var(--yaml-key)}
.eline.yaml .v{color:var(--yaml-val)}
.eline.head .txt{color:var(--md-head);font-weight:600}
.eline.md .txt{color:var(--ink)}
.eline.md .b{font-weight:700}
.eline.fence .txt{color:var(--fence);background:#F4F2ED}
.eline.r .txt{color:var(--rcode);background:#F4F2ED}
.eline.blank .txt{color:transparent}
.eline.outp{margin:0}
.eline.outp .gut{color:transparent}
.eline.outp .txt{color:#5E6670;background:#EDEAE3;font-style:normal}
.ecursor{display:inline-block;width:7px;height:14px;background:var(--mark);vertical-align:-2px;animation:blink .9s step-end infinite;margin-left:12px}
@keyframes blink{50%{opacity:0}}

/* ---------- rendered output pane ---------- */
.renderpane{
  margin:16px 0 0 46px;max-width:640px;
  background:#fff;border:1px solid var(--rule);border-radius:8px;overflow:hidden;
  opacity:0;transform:translateY(6px);transition:opacity .5s ease-out, transform .5s ease-out;
}
.renderpane.shown{opacity:1;transform:none}
@media(max-width:640px){.renderpane{margin-left:0}}
.rp-bar{
  background:#F2F0EB;border-bottom:1px solid var(--rule);padding:6px 12px;
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--slate);
}
.rp-body{padding:22px 26px 26px;font-family:Georgia,serif;color:#1a1a1a}
.rp-body .rtitle{font-size:25px;font-weight:700;line-height:1.2;margin-bottom:3px;font-family:'IBM Plex Sans',sans-serif}
.rp-body .rauth{font-size:13px;color:#666;margin-bottom:20px;font-family:'IBM Plex Sans',sans-serif}
.rp-body h3{font-size:18px;margin:18px 0 8px;font-family:'IBM Plex Sans',sans-serif;font-weight:600}
.rp-body p{font-size:14.5px;line-height:1.62;margin-bottom:11px}
.rp-body .rcode{
  background:#F4F2ED;border:1px solid #E4E0D8;border-radius:4px;
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.7;
  padding:10px 13px;margin:12px 0;white-space:pre;overflow-x:auto;
}
.rp-body .rout{
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.7;
  color:#5E6670;padding:2px 13px 10px;white-space:pre;
}

.tryit{margin:18px 0 0 46px;border-left:3px solid var(--mark);background:var(--mark-soft);padding:14px 18px;border-radius:0 6px 6px 0;max-width:64ch;font-size:15px}
@media(max-width:640px){.tryit{margin-left:0}}
.tryit strong{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px;color:var(--mark)}
.tryit code{font-family:'IBM Plex Mono',monospace;font-size:.9em;background:#fff;padding:1px 5px;border-radius:3px}

.controls{margin:22px 0 0 46px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media(max-width:640px){.controls{margin-left:0}}
button{font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:500;padding:9px 18px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:4px;cursor:pointer;transition:transform .12s}
button:hover{transform:translateY(-1px)}
button:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
button.ghostbtn{background:transparent;color:var(--ink)}
button:disabled{opacity:.35;cursor:default;transform:none}
.hint{font-size:13px;color:var(--slate);font-family:'IBM Plex Mono',monospace}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .eline{opacity:1}.step{opacity:1}.renderpane{opacity:1;transform:none}
}
</style>
</head>

</figure>
</header>

<div class="progress">
  <div class="pips" id="pips"></div>
  <div class="counter" id="counter">0 / 0</div>
</div>

<div id="steps"></div>

</div>

<script>
const PARTS = {
  0: {n:"Part one", t:"What a Quarto document is", d:"An R script holds code and nothing else. A Quarto document holds your writing, your code, and the results, all in one file."},
  3: {n:"Part two", t:"Building one", d:"Three ingredients, added one at a time. By the end you will have a small finished report."}
};

const STEPS = [
  {
    title: "Make a new one",
    blurb: "In RStudio: <strong>File &rarr; New File &rarr; Quarto Document</strong>. Give it a title, leave the format as HTML, click Create. You get a file ending in <code>.qmd</code> with some example text already in it. Delete all of it and start from an empty file.",
    fname: "untitled.qmd",
    lines: [
      {t:'blank', s:''}
    ],
    tryit: "An R script is <code>.R</code> and holds only code. A Quarto document is <code>.qmd</code> and holds three different things at once. The next three steps add them one at a time."
  },
  {
    title: "The header at the top",
    blurb: "Every Quarto document opens with a short block fenced by three dashes above and below. This is the header. It sets the title, your name, and what kind of file to produce.",
    fname: "untitled.qmd",
    lines: [
      {t:'yamldash', s:'---'},
      {t:'yaml', s:'title: ', v:'"Income in a small sample"'},
      {t:'yaml', s:'author: ', v:'"Your Name"'},
      {t:'yaml', s:'format: ', v:'html'},
      {t:'yamldash', s:'---'}
    ],
    tryit: "The dashes matter. Three of them, on their own line, above and below. If you delete one the document will refuse to render."
  },
  {
    title: "Write something",
    blurb: "Below the header, just type. Plain sentences are plain sentences. A line starting with <code>##</code> becomes a heading. Words wrapped in two asterisks come out bold.",
    fname: "untitled.qmd",
    lines: [
      {t:'yamldash', s:'---'},
      {t:'yaml', s:'title: ', v:'"Income in a small sample"'},
      {t:'yaml', s:'author: ', v:'"Your Name"'},
      {t:'yaml', s:'format: ', v:'html'},
      {t:'yamldash', s:'---'},
      {t:'blank', s:''},
      {t:'head', s:'## What we found'},
      {t:'blank', s:''},
      {t:'md', s:'Six people earn between 32 and 47. One earns **950**.'}
    ],
    tryit: "This is Markdown. It is the whole formatting system, and you have now seen most of what you need: a heading, bold text, and ordinary sentences."
  },
  {
    title: "Add a code chunk",
    blurb: "Code lives in a fenced block. Three backticks and <code>{r}</code> to open, three backticks to close. Rather than typing the fences, press <strong>Cmd+Option+I</strong> and RStudio inserts them for you.",
    fname: "untitled.qmd",
    lines: [
      {t:'head', s:'## What we found'},
      {t:'blank', s:''},
      {t:'md', s:'Six people earn between 32 and 47. One earns **950**.'},
      {t:'blank', s:''},
      {t:'fence', s:'```{r}'},
      {t:'r', s:'income <- c(32, 35, 38, 41, 44, 47, 950)'},
      {t:'r', s:'mean(income)'},
      {t:'r', s:'median(income)'},
      {t:'fence', s:'```'}
    ],
    tryit: "The header lines are still up there. This step just shows the lower part of the file so the chunk fits on screen."
  },
  {
    title: "Run the chunk",
    blurb: "Click the small green arrow at the right edge of the chunk, or press <strong>Cmd+Shift+Enter</strong>. The code runs and the answers appear directly underneath, still inside the editor.",
    fname: "untitled.qmd",
    lines: [
      {t:'fence', s:'```{r}'},
      {t:'r', s:'income <- c(32, 35, 38, 41, 44, 47, 950)'},
      {t:'r', s:'mean(income)'},
      {t:'r', s:'median(income)'},
      {t:'fence', s:'```'},
      {t:'outp', s:'[1] 169.5714'},
      {t:'outp', s:'[1] 41'}
    ],
    tryit: "Running a chunk is for checking your work as you go. It does not produce the finished document. That is the next step, and students mix these two up constantly."
  },
  {
    title: "Render it",
    blurb: "Click <strong>Render</strong> at the top of the editor. Quarto runs every chunk from a clean start, top to bottom, and builds a web page from the result.",
    fname: "untitled.qmd",
    hot: true,
    lines: [
      {t:'yamldash', s:'---'},
      {t:'yaml', s:'title: ', v:'"Income in a small sample"'},
      {t:'yaml', s:'author: ', v:'"Your Name"'},
      {t:'yaml', s:'format: ', v:'html'},
      {t:'yamldash', s:'---'},
      {t:'blank', s:''},
      {t:'head', s:'## What we found'},
      {t:'blank', s:''},
      {t:'md', s:'Six people earn between 32 and 47. One earns **950**.'},
      {t:'blank', s:''},
      {t:'fence', s:'```{r}'},
      {t:'r', s:'income <- c(32, 35, 38, 41, 44, 47, 950)'},
      {t:'r', s:'mean(income)'},
      {t:'r', s:'median(income)'},
      {t:'fence', s:'```'},
      {t:'blank', s:''},
      {t:'md', s:'The median describes a typical person better here.'}
    ],
    render: true,
    tryit: "Compare the two panes. The header became a title. The <code>##</code> line became a heading. The asterisks became bold. The chunk became code with its answers below it. Nothing was copied and pasted, so the numbers cannot disagree with the code that produced them. That is the whole reason we use Quarto."
  },
  {
    title: "When it will not render",
    blurb: "Rendering runs every chunk in a fresh session. Anything you created earlier in the console is gone, so a chunk that worked a minute ago can fail here.",
    fname: "untitled.qmd",
    lines: [
      {t:'fence', s:'```{r}'},
      {t:'r', s:'mean(incme)'},
      {t:'fence', s:'```'},
      {t:'outp', s:'Error: object \'incme\' not found'}
    ],
    tryit: "Read the message. It names the problem, and here it is a typo. The other common cause is using something you made in the console but never wrote into the document. If it is not in the file, it does not exist when you render."
  }
];

const stepsEl = document.getElementById('steps');
const pipsEl = document.getElementById('pips');
const counterEl = document.getElementById('counter');
counterEl.textContent = '0 / ' + STEPS.length;
let completed = 0;

const RENDERED =
  '<div class="rp-bar">Rendered output</div>' +
  '<div class="rp-body">' +
  '<div class="rtitle">Income in a small sample</div>' +
  '<div class="rauth">Your Name</div>' +
  '<h3>What we found</h3>' +
  '<p>Six people earn between 32 and 47. One earns <strong>950</strong>.</p>' +
  '<div class="rcode">income &lt;- c(32, 35, 38, 41, 44, 47, 950)\nmean(income)</div>' +
  '<div class="rout">[1] 169.5714</div>' +
  '<div class="rcode">median(income)</div>' +
  '<div class="rout">[1] 41</div>' +
  '<p>The median describes a typical person better here.</p>' +
  '</div>';

function lineHTML(ln, n){
  let body = ln.s;
  if (ln.t === 'yaml') body = ln.s + '<span class="v">' + ln.v + '</span>';
  if (ln.t === 'md') body = ln.s.replace(/\*\*(.+?)\*\*/g, '<span class="b">**$1**</span>');
  const gut = ln.t === 'outp' ? '' : n;
  return '<div class="eline ' + ln.t + '"><span class="gut">' + gut + '</span><span class="txt">' + body + '</span></div>';
}

STEPS.forEach((s, i) => {
  const pip = document.createElement('div');
  pip.className = 'pip' + (i === 0 ? ' here' : '');
  pip.id = 'pip' + i;
  pipsEl.appendChild(pip);

  if (PARTS[i]) {
    const p = document.createElement('div');
    p.className = 'part';
    p.innerHTML = PARTS[i].n + '<span>' + PARTS[i].t + '</span><p>' + PARTS[i].d + '</p>';
    stepsEl.appendChild(p);
  }

  const sec = document.createElement('section');
  sec.className = 'step' + (i === 0 ? ' active' : '');
  sec.id = 'step' + i;

  sec.innerHTML =
    '<div class="step-head"><div class="num">' + String(i+1).padStart(2,'0') + '</div><h2>' + s.title + '</h2></div>' +
    '<p class="blurb">' + s.blurb + '</p>' +
    '<div class="edwrap"><div class="edbar"><span class="fname">' + s.fname + '</span>' +
      '<span class="rbtn' + (s.hot ? ' hot' : '') + '">Render</span></div>' +
      '<div class="editor" id="ed' + i + '"></div></div>' +
    (s.render ? '<div class="renderpane" id="rp' + i + '">' + RENDERED + '</div>' : '') +
    (s.tryit ? '<div class="tryit"><strong>Notice</strong>' + s.tryit + '</div>' : '') +
    '<div class="controls"><button id="run' + i + '">' + (s.render ? 'Render it' : 'Type this') + '</button>' +
    '<button class="ghostbtn" id="reset' + i + '" disabled>Replay</button>' +
    '<span class="hint" id="hint' + i + '"></span></div>';

  stepsEl.appendChild(sec);
});

STEPS.forEach((s, i) => {
  const edEl = document.getElementById('ed'+i);
  const runBtn = document.getElementById('run'+i);
  const resetBtn = document.getElementById('reset'+i);
  const hintEl = document.getElementById('hint'+i);
  let running = false;

  function play(){
    if(running) return;
    running = true;
    runBtn.disabled = true;
    resetBtn.disabled = true;
    edEl.innerHTML = '';

    let delay = 0, n = 0;
    s.lines.forEach(ln => {
      if (ln.t !== 'outp') n++;
      const wrap = document.createElement('div');
      wrap.innerHTML = lineHTML(ln, n);
      const el = wrap.firstChild;
      edEl.appendChild(el);
      delay += ln.t === 'outp' ? 320 : 220;
      setTimeout(() => el.classList.add('shown'), delay);
    });

    setTimeout(() => {
      running = false;
      resetBtn.disabled = false;
      runBtn.textContent = 'Done';
      hintEl.textContent = i < STEPS.length - 1 ? 'keep going' : 'that is all of them';
      document.getElementById('step'+i).classList.add('seen');
      document.getElementById('pip'+i).className = 'pip done';
      if(i < STEPS.length - 1){
        document.getElementById('step'+(i+1)).classList.add('active');
        document.getElementById('pip'+(i+1)).className = 'pip here';
      }
      const rp = document.getElementById('rp'+i);
      if(rp) setTimeout(() => rp.classList.add('shown'), 400);
      completed = Math.max(completed, i+1);
      counterEl.textContent = completed + ' / ' + STEPS.length;
    }, delay + 300);
  }

  runBtn.addEventListener('click', play);
  resetBtn.addEventListener('click', () => {
    runBtn.textContent = s.render ? 'Render it' : 'Type this';
    runBtn.disabled = false;
    hintEl.textContent = '';
    edEl.innerHTML = '';
    const rp = document.getElementById('rp'+i);
    if(rp) rp.classList.remove('shown');
  });
});
</script>
</body>
</html>
